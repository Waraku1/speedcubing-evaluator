name: EE experiment validation

on:
  push:
    branches:
      - ee/experiment-pipeline-v1
    paths:
      - "research/ee-experiment/**"
      - "src/lib/ee-experiment/**"
      - "scripts/ee-experiment/**"
      - "tests/unit/ee-*.test.ts"
      - ".github/workflows/ee-experiment-validation.yml"
  pull_request:
    branches:
      - main
    paths:
      - "research/ee-experiment/**"
      - "src/lib/ee-experiment/**"
      - "scripts/ee-experiment/**"
      - "tests/unit/ee-*.test.ts"
      - ".github/workflows/ee-experiment-validation.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      EE_SOURCE_COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vitest run tests/unit/ee-experiment-features.test.ts tests/unit/ee-random-state.test.ts
      - run: pnpm exec tsc -p research/ee-experiment/tsconfig.json
      - name: Run 20-state paired pilot
        run: pnpm exec tsx scripts/ee-experiment/run.ts --samples 20 --seed EE-2026-RANDOM-STATE-PILOT-01 --out research/ee-experiment/output/pilot.csv
      - name: Check pilot manifest
        run: node -e 'const m=require("./research/ee-experiment/output/pilot.manifest.json"); if(m.failedRows!==0||m.actualRows!==40||m.pairedStates!==20||m.samplingMode!=="random_state_uniform_coordinate_v1") process.exit(1); console.log(m)'
      - uses: actions/upload-artifact@v4
        with:
          name: ee-random-state-pilot-data
          path: |
            research/ee-experiment/output/pilot.csv
            research/ee-experiment/output/pilot.manifest.json
