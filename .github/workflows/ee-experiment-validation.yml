name: EE experiment validation

on:
  push:
    branches:
      - ee/experiment-pipeline-v1
    paths:
      - "research/ee-experiment/**"
      - "src/lib/ee-experiment/**"
      - "scripts/ee-experiment/**"
      - "tests/unit/ee-experiment-features.test.ts"
      - ".github/workflows/ee-experiment-validation.yml"
  pull_request:
    branches:
      - main
    paths:
      - "research/ee-experiment/**"
      - "src/lib/ee-experiment/**"
      - "scripts/ee-experiment/**"
      - "tests/unit/ee-experiment-features.test.ts"
      - ".github/workflows/ee-experiment-validation.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vitest run tests/unit/ee-experiment-features.test.ts
      - run: pnpm type-check
      - name: Run 20-scramble paired pilot
        run: pnpm exec tsx scripts/ee-experiment/run.ts --samples 20 --length 20 --seed EE-2026-PILOT-01 --out research/ee-experiment/output/pilot.csv
      - name: Check pilot manifest
        run: node -e 'const m=require("./research/ee-experiment/output/pilot.manifest.json"); if(m.failedRows!==0||m.actualRows!==40||m.pairedScrambles!==20) process.exit(1); console.log(m)'
      - uses: actions/upload-artifact@v4
        with:
          name: ee-pilot-data
          path: |
            research/ee-experiment/output/pilot.csv
            research/ee-experiment/output/pilot.manifest.json
