name: EE main random-state dataset

on:
  workflow_dispatch:

concurrency:
  group: ee-main-random-state-dataset
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      EE_SOURCE_COMMIT_SHA: ${{ github.sha }}
      EE_STUDY_SEED: EE-2026-RANDOM-STATE-MAIN-01
      EE_SAMPLE_COUNT: "300"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate experiment unit tests
        run: pnpm exec vitest run tests/unit/ee-experiment-features.test.ts tests/unit/ee-random-state.test.ts
      - name: Type-check experiment dependency graph
        run: pnpm exec tsc -p research/ee-experiment/tsconfig.json
      - name: Generate 300-state paired main dataset
        run: pnpm exec tsx scripts/ee-experiment/run.ts --samples "$EE_SAMPLE_COUNT" --seed "$EE_STUDY_SEED" --out research/ee-experiment/output/main-300.csv
      - name: Independently audit main dataset
        run: python3 scripts/ee-experiment/audit.py --csv research/ee-experiment/output/main-300.csv --manifest research/ee-experiment/output/main-300.manifest.json --expected-samples "$EE_SAMPLE_COUNT" --out research/ee-experiment/output/main-300.audit.json
      - name: Upload immutable research artifact
        uses: actions/upload-artifact@v4
        with:
          name: ee-random-state-main-300
          retention-days: 90
          path: |
            research/ee-experiment/output/main-300.csv
            research/ee-experiment/output/main-300.manifest.json
            research/ee-experiment/output/main-300.audit.json
