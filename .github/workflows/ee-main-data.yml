name: EE main data generation

on:
  push:
    branches:
      - ee/experiment-pipeline-v1
    paths:
      - ".github/workflows/ee-main-data.yml"
  workflow_dispatch:

jobs:
  generate-main:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vitest run tests/unit/ee-experiment-features.test.ts tests/unit/ee-random-state.test.ts
      - run: pnpm exec tsc -p research/ee-experiment/tsconfig.json
      - name: Generate frozen 300-state primary dataset
        run: pnpm exec tsx scripts/ee-experiment/run.ts --samples 300 --seed EE-2026-RANDOM-STATE-MAIN-01 --out research/ee-experiment/output/main-v1.csv
      - name: Check primary manifest
        run: node -e 'const m=require("./research/ee-experiment/output/main-v1.manifest.json"); if(m.failedRows!==0||m.actualRows!==600||m.pairedStates!==300||m.samples!==300||m.studySeed!=="EE-2026-RANDOM-STATE-MAIN-01"||m.samplingMode!=="random_state_uniform_coordinate_v1") process.exit(1); console.log(m)'
      - name: Write checksums
        run: |
          cd research/ee-experiment/output
          sha256sum main-v1.csv main-v1.manifest.json > main-v1.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: ee-random-state-main-v1
          path: |
            research/ee-experiment/output/main-v1.csv
            research/ee-experiment/output/main-v1.manifest.json
            research/ee-experiment/output/main-v1.sha256
